openapi: 3.0.3
info:
  title: CAB System - Rating API
  version: 1.0.0
  description: Driver rating. Covers FR36 and AC17.

servers:
  - url: http://localhost:8080/api/v1

tags:
  - name: Ratings

paths:
  /trips/{tripId}/rating:
    post:
      tags:
        - Ratings
      summary: Đánh giá tài xế sau chuyến đi
      operationId: rateDriver
      security:
        - bearerAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RatingRequest'
      responses:
        '201':
          description: Đánh giá thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rating'
        '400':
          description: Chuyến chưa hoàn thành hoặc dữ liệu không hợp lệ
        '404':
          description: Không tìm thấy chuyến
        '409':
          description: Chuyến đã được đánh giá

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RatingRequest:
      type: object
      required:
        - score
      properties:
        score:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        comment:
          type: string
          maxLength: 1000
          example: Tài xế thân thiện và đúng giờ

    Rating:
      type: object
      properties:
        id:
          type: string
          example: RAT001
        tripId:
          type: string
          example: TRIP001
        score:
          type: integer
          example: 5
        comment:
          type: string
