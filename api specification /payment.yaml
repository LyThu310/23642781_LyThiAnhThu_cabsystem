openapi: 3.0.3
info:
  title: CAB System - Payment API
  version: 1.0.0
  description: Fare and payment services. Covers FR24-FR28 and AC10-AC12.

servers:
  - url: http://localhost:8080/api/v1

tags:
  - name: Payments

paths:
  /trips/{tripId}/fare:
    get:
      tags:
        - Payments
      summary: Xem cước phí chuyến đi
      operationId: getFare
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TripId'
      responses:
        '200':
          description: Thông tin cước phí
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fare'
        '404':
          description: Không tìm thấy chuyến

  /trips/{tripId}/payments:
    post:
      tags:
        - Payments
      summary: Thanh toán chuyến đi
      operationId: createPayment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TripId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
      responses:
        '201':
          description: Tạo giao dịch thanh toán thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          description: Dữ liệu thanh toán không hợp lệ

  /payments/{paymentId}:
    get:
      tags:
        - Payments
      summary: Xem kết quả thanh toán
      operationId: getPayment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          description: Thông tin thanh toán
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '404':
          description: Không tìm thấy giao dịch

  /payments/{paymentId}/retry:
    post:
      tags:
        - Payments
      summary: Thực hiện lại giao dịch thất bại
      operationId: retryPayment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          description: Thực hiện lại giao dịch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          description: Giao dịch không thể thực hiện lại
        '404':
          description: Không tìm thấy giao dịch

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TripId:
      name: tripId
      in: path
      required: true
      schema:
        type: string

    PaymentId:
      name: paymentId
      in: path
      required: true
      schema:
        type: string

  schemas:
    Fare:
      type: object
      properties:
        tripId:
          type: string
          example: TRIP001
        amount:
          type: number
          format: double
          example: 85000
        currency:
          type: string
          example: VND

    CreatePaymentRequest:
      type: object
      required:
        - method
      properties:
        method:
          type: string
          enum:
            - CASH
            - ELECTRONIC
        provider:
          type: string
          nullable: true
          example: PAYMENT_PROVIDER

    Payment:
      type: object
      properties:
        id:
          type: string
          example: PAY001
        tripId:
          type: string
          example: TRIP001
        amount:
          type: number
          format: double
          example: 85000
        method:
          type: string
          enum:
            - CASH
            - ELECTRONIC
        status:
          type: string
          enum:
            - PENDING
            - SUCCESS
            - FAILED
