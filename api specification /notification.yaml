openapi: 3.0.3
info:
  title: CAB System - Notification API
  version: 1.0.0
  description: Notification retrieval. Covers FR29-FR33 and AC16.

servers:
  - url: http://localhost:8080/api/v1

tags:
  - name: Notifications

paths:
  /notifications:
    get:
      tags:
        - Notifications
      summary: Xem danh sách thông báo
      operationId: getNotifications
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Danh sách thông báo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
        '401':
          description: Chưa xác thực

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Notification:
      type: object
      properties:
        id:
          type: string
          example: NOTI001
        userId:
          type: string
          example: CUS001
        type:
          type: string
          enum:
            - BOOKING_RECEIVED
            - DRIVER_ASSIGNED
            - DRIVER_ARRIVED
            - TRIP_COMPLETED
            - PAYMENT_RESULT
            - NO_DRIVER_FOUND
        message:
          type: string
          example: Tài xế đã nhận chuyến
        createdAt:
          type: string
          format: date-time
        read:
          type: boolean
          example: false
