openapi: 3.0.3
info:
  title: CAB System - Authentication API
  version: 1.0.0
  description: Authentication services for CAB System. Covers FR01-FR02.

servers:
  - url: http://localhost:8080/api/v1

tags:
  - name: Authentication

paths:
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Đăng ký tài khoản khách hàng
      operationId: registerCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Đăng ký thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          description: Dữ liệu đăng ký không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Tài khoản đã tồn tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Đăng nhập
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Thông tin đăng nhập không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    RegisterRequest:
      type: object
      required:
        - fullName
        - phone
        - password
      properties:
        fullName:
          type: string
          example: Nguyen Van A
        phone:
          type: string
          example: "0901234567"
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: secret123

    LoginRequest:
      type: object
      required:
        - identifier
        - password
      properties:
        identifier:
          type: string
          example: "0901234567"
        password:
          type: string
          format: password
          example: secret123

    LoginResponse:
      type: object
      required:
        - accessToken
        - tokenType
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiJ9
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          format: int64
          example: 3600

    Customer:
      type: object
      required:
        - id
        - fullName
        - phone
      properties:
        id:
          type: string
          example: CUS001
        fullName:
          type: string
          example: Nguyen Van A
        phone:
          type: string
          example: "0901234567"
        email:
          type: string
          format: email
          example: user@example.com

    Error:
      type: object
      properties:
        code:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: Dữ liệu không hợp lệ
