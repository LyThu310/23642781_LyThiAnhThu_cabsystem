openapi: 3.0.3
info:
  title: CAB System - Customer API
  version: 1.0.0
  description: Customer profile and trip history. Covers FR03, FR34-FR35.

servers:
  - url: http://localhost:8080/api/v1

tags:
  - name: Customers

paths:
  /customers/me:
    get:
      tags:
        - Customers
      summary: Xem thông tin cá nhân
      operationId: getMyProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Thông tin khách hàng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '401':
          description: Chưa xác thực

    patch:
      tags:
        - Customers
      summary: Cập nhật thông tin cá nhân
      operationId: updateMyProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerUpdateRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          description: Dữ liệu không hợp lệ
        '401':
          description: Chưa xác thực

  /customers/me/trips:
    get:
      tags:
        - Customers
      summary: Xem lịch sử chuyến đi
      operationId: getCustomerTripHistory
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Danh sách lịch sử chuyến
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TripSummary'
        '401':
          description: Chưa xác thực

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Customer:
      type: object
      properties:
        id:
          type: string
          example: CUS001
        fullName:
          type: string
          example: Nguyen Van A
        phone:
          type: string
          example: "0901234567"
        email:
          type: string
          format: email
          example: user@example.com

    CustomerUpdateRequest:
      type: object
      minProperties: 1
      properties:
        fullName:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email

    TripSummary:
      type: object
      properties:
        id:
          type: string
          example: TRIP001
        status:
          type: string
          example: COMPLETED
        fare:
          type: number
          format: double
          example: 85000
        createdAt:
          type: string
          format: date-time
          example: 2026-09-08T10:30:00Z
